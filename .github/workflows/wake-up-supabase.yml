name: Wake Up Supabase

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase projects
        env:
          SUPABASE_PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          import urllib.error

          try:
              projects = json.loads(os.environ.get("SUPABASE_PROJECTS_JSON", ""))
          except (ValueError, TypeError):
              print("ERROR: SUPABASE_PROJECTS_JSON must contain valid JSON.")
              sys.exit(1)
          if not isinstance(projects, list) or not projects:
              print("ERROR: Configure a non-empty list of projects.")
              sys.exit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          failed = False
          print(f"Found {len(projects)} Supabase project(s).")
          for index, project in enumerate(projects, 1):
              if not isinstance(project, dict):
                  print(f"ERROR: Project {index} must be an object.")
                  failed = True
                  continue
              name = project.get("name", "")
              url = project.get("url", "")
              key = project.get("api_key", "")
              if not all(isinstance(v, str) for v in (name, url, key)):
                  print(f"ERROR: Project {index} fields must be strings.")
                  failed = True
                  continue
              name, url, key = name.strip(), url.strip().rstrip("/"), key.strip()
              if (not re.fullmatch(r"[A-Za-z0-9 _.-]{1,80}", name)
                  or not re.fullmatch(r"https://[a-z0-9]{20}\.supabase\.co", url)
                  or not re.fullmatch(r"sb_publishable_[A-Za-z0-9_-]+", key)):
                  print(f"ERROR: Project {index} needs a valid name, Supabase URL, and Publishable API Key.")
                  failed = True
                  continue
              print(f"::add-mask::{key}")
              request = urllib.request.Request(
                  f"{url}/rest/v1/", headers={"apikey": key}, method="GET"
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      status = response.status
                  print(f"{name}: HTTP {status}")
                  if status != 200:
                      failed = True
              except urllib.error.HTTPError as error:
                  print(f"{name}: HTTP {error.code}")
                  body = error.read(4096).decode("utf-8", errors="replace").lower()
                  try:
                      detail = json.loads(body)
                      message = detail.get("message", "")
                      if isinstance(message, str) and re.fullmatch(r"[a-z .,:;'()-]{1,200}", message):
                          print(f"Authentication message: {message}")
                  except (ValueError, AttributeError):
                      pass
                  for reason in ("invalid api key", "no api key", "invalid jwt", "permission denied", "jwt expired"):
                      if reason in body:
                          print(f"Reason: {reason}")
                  failed = True
              except Exception:
                  print(f"{name}: connection failed or timed out.")
                  failed = True

          if failed:
              print("One or more projects failed.")
              sys.exit(1)
          print("All Supabase projects responded HTTP 200.")
          PY
