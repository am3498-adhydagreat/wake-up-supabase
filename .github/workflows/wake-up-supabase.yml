
name: Wake Up Supabase

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase projects
        env:
          SUPABASE_PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS_JSON }}

        run: |
          if [ -z "$SUPABASE_PROJECTS_JSON" ]; then
            echo "ERROR: SUPABASE_PROJECTS_JSON is not set."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          try:
              projects = json.loads(
                  os.environ["SUPABASE_PROJECTS_JSON"]
              )
          except Exception as e:
              print(f"Invalid JSON: {e}")
              sys.exit(1)

          if not isinstance(projects, list) or not projects:
              print("No Supabase projects configured.")
              sys.exit(1)

          print(f"Found {len(projects)} Supabase project(s).\n")

          has_error = False

          for idx, proj in enumerate(projects):
              name = proj.get("name", f"Project-{idx+1}")
              url = str(proj.get("url", "")).strip().rstrip("/")
              key = str(proj.get("api_key", "")).strip()

              if not url or not key:
                  print(f"ERROR: {name} missing URL or API key.")
                  has_error = True
                  continue

              target_url = f"{url}/rest/v1/"

              print(f"Pinging: {name}")

              req = urllib.request.Request(
                  target_url,
                  headers={
                      "apikey": key
                  },
                  method="GET"
              )

              try:
                  with urllib.request.urlopen(
                      req, timeout=20
                  ) as response:
                      print(
                          f"SUCCESS: {name} HTTP {response.status}\n"
                      )

              except urllib.error.HTTPError as e:
                  body = e.read().decode(
                      "utf-8", errors="replace"
                  )
                  print(
                      f"FAILED: {name} HTTP {e.code}"
                  )
                  print(f"Response: {body[:500]}\n")
                  has_error = True

              except Exception as e:
                  print(f"CONNECTION ERROR: {name}: {e}\n")
                  has_error = True

          if has_error:
              print("One or more projects failed.")
              sys.exit(1)

          print("All Supabase projects responded successfully!")
          PY
